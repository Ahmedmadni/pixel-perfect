name: Maintenance branch verification

on:
  push:
    branches:
      - chatgpt/complete-maintenance-phase2
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run maintenance tests
        run: bunx vitest run src/features/maintenance/engine/engine.test.ts
      - name: Build application
        run: bun run build
