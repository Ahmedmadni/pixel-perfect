name: Phase 2 verification

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run phase 2 tests
        run: bunx vitest run src/features/maintenance/engine/engine.test.ts src/features/expenses/lib/summary.test.ts src/features/parts/lib/analytics.test.ts src/features/diagnostics/lib/analytics.test.ts src/features/reminders/lib/engine.test.ts
      - name: Build application
        run: bun run build
